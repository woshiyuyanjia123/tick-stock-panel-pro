appId: com.tspquant.tickstockpanelpro
productName: TICK STOCK PANEL Pro
copyright: Copyright © 2026 TSP Quant Engineering
directories:
  output: release
  buildResources: build
asar: false
npmRebuild: false
files:
  - electron/**/*
  - dist/**/*
  - dist-electron/**/*
  - scripts/ego_alt_collector.mjs
  - scripts/ego_fupeng_24h_watcher.mjs
  - build/**/*
  - package.json
  - "!node_modules/**/*"
win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
nsis:
  artifactName: TSP-Pro-Setup-${version}-${arch}.${ext}
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: TICK STOCK PANEL Pro
portable:
  artifactName: TSP-Pro-Portable-${version}-${arch}.${ext}
mac:
  icon: build/icon.png
  category: public.app-category.finance
  artifactName: TSP-Pro-${version}-${arch}.${ext}
  target:
    - target: dmg
      arch:
        - arm64
        - x64
    - target: zip
      arch:
        - arm64
        - x64
dmg:
  title: TICK STOCK PANEL Pro ${version}
